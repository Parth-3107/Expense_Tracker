{% extends "base.html" %}

{% block title %}Manage Expenses - Expense Tracker{% endblock %}

{% block content %}
<div class="expenses-container">
    <div class="page-header">
        <h1>Manage Expenses</h1>
        <button onclick="showAddExpenseModal()" class="btn btn-primary">
             Add New Expense
        </button>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Month:</label>
            <select id="filter-month" class="filter-select">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Year:</label>
            <select id="filter-year" class="filter-select"></select>
        </div>
        
        <div class="filter-group">
            <label>Category:</label>
            <select id="filter-category" class="filter-select">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <button onclick="loadExpenses()" class="btn btn-secondary">Apply Filters</button>
    </div>

    <!-- Expenses Table -->
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expenses-table-body">
                <tr>
                    <td colspan="5" class="text-center">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Expense Modal -->
<div id="expense-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Add Expense</h2>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="expense-amount" step="0.01" required 
                           placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="expense-category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="expense-description" rows="3" placeholder="Optional description"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="expense-date" required>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Populate filter year dropdown and set current month
    (function initFilters(){
        const yearSelect = document.getElementById('filter-year');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 1; y++) {
            const opt = document.createElement('option');
            opt.value = y; opt.text = y; if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }
        document.getElementById('filter-month').value = new Date().getMonth() + 1;
        // Initial load
        if (typeof loadExpenses === 'function') loadExpenses();
    })();

    // Handle add/edit form submit
    document.getElementById('expense-form').addEventListener('submit', async function(e){
        e.preventDefault();
        const expenseId = document.getElementById('expense-id').value;
        const month = document.getElementById('filter-month')?.value;
        const year = document.getElementById('filter-year')?.value;

        if (!expenseId) {
            // Use existing addExpense helper which reads form fields
            if (typeof addExpense === 'function') {
                await addExpense();
                if (month && year) await loadExpenses();
                return;
            }
        }

        // Update existing expense
        const payload = {
            amount: parseFloat(document.getElementById('expense-amount').value),
            category: document.getElementById('expense-category').value,
            description: document.getElementById('expense-description').value,
            expense_date: document.getElementById('expense-date').value
        };

        try {
            const resp = await fetch(`/api/expenses/${expenseId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                showSuccessToast('Expense updated');
                closeModal();
                if (month && year) await loadExpenses();
            } else {
                const err = await resp.json();
                showErrorToast(err.error || 'Update failed');
            }
        } catch (err) {
            console.error(err);
            showErrorToast('Update failed');
        }
    });
</script>
{% endblock %}
